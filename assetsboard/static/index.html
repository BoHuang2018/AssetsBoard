<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>assetsboard 儀表板</title>
<style>
:root{--bg:#0f1218;--panel:#171b23;--panel2:#1e2430;--line:#2a3140;--text:#e6e9ef;--mut:#8b93a5;--up:#2fbf71;--down:#ef5350;--acc:#4f8cff;--warn:#e0a526}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header .meta{color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:1px solid transparent;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{color:var(--text);background:var(--panel2);border-color:var(--line)}
.sp{flex:1}.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}.toggle{display:flex;align-items:center;gap:6px;color:var(--mut);cursor:pointer;user-select:none}
main{padding:20px 22px;max-width:1400px;margin:auto}section{display:none}section.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .k{color:var(--mut);font-size:12px}.card .v{font-size:24px;font-weight:600;margin-top:4px}.card .s{color:var(--mut);font-size:12px;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:500;cursor:pointer;position:sticky;top:0;background:var(--panel)}th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}tr:hover td{background:var(--panel2)}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}.warn{color:var(--warn)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:1px 3px 1px 0;background:var(--panel2);border:1px solid var(--line)}
.o-spot_buy{border-color:#4f8cff}.o-spot_grid_bot{border-color:#b26bff}.o-dual_strike,.o-dual_market,.o-dual_settle{border-color:#e0a526}.o-reward,.o-earn_accrued{border-color:#2fbf71}.o-settlement_0704{border-color:#ef5350}.o-deposit,.o-fiat_deposit,.o-eur_purchase{border-color:#26c6da}
body.hide .amt{filter:blur(7px);user-select:none}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%}
.note{padding:8px 0;border-bottom:1px solid var(--line)}.note b{display:inline-block;min-width:110px}
.conf-high{color:var(--up)}.conf-medium{color:var(--warn)}.conf-low{color:var(--down)}
svg text{fill:var(--mut);font-size:11px}.legend span{margin-right:14px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#err{color:var(--down);padding:20px}.small{font-size:12px}

.pnl-hero{background:linear-gradient(135deg,#1a2230 0%,#141a24 100%);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end}
.pnl-hero .state{font-size:15px;font-weight:600;letter-spacing:.04em}
.pnl-hero .big{font-size:42px;font-weight:700;line-height:1.1;margin-top:6px}
.pnl-hero .big.up{color:var(--up)}.pnl-hero .big.down{color:var(--down)}
.pnl-hero .sub{color:var(--mut);font-size:13px;margin-top:8px;max-width:520px}
.pnl-hero .side{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.pnl-hero .chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.pnl-hero .chip .k{font-size:11px;color:var(--mut)}.pnl-hero .chip .v{font-size:18px;font-weight:600;margin-top:2px}
#hint{display:none;background:#2a2312;border:1px solid var(--warn);color:#f3d27a;border-radius:10px;padding:10px 14px;margin-bottom:14px;white-space:pre-line}
#hint code,.code{background:#00000055;padding:1px 6px;border-radius:5px;color:var(--text);user-select:all}
#rstatus{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}#rstatus .bar{width:120px}
.inp{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 8px;width:140px;font:inherit}
.stale{color:var(--warn);font-size:12px}
.subnav{margin:-4px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}.sub{display:none}.sub.on{display:block}
.sumlist{margin:0;padding-left:18px}.sumlist li{margin:4px 0}
</style>
</head>
<body class="hide">
<header>
  <h1>assetsboard</h1>
  <nav id="nav">
    <button data-s="ov" class="on">總覽</button><button data-s="bg">Bitget</button><button data-s="mx">MEXC</button><button data-s="kr">Kraken</button><button data-s="cc">Crypto.com</button><button data-s="wl">鏈上錢包</button><button data-s="ef">ether.fi Cash</button><button data-s="ib">IBKR</button>
  </nav>
  <div class="sp"></div>
  <span id="rstatus"></span>
  <span class="meta" id="meta"></span>
  <label class="toggle"><input type="checkbox" id="hide" checked> 隱藏金額</label>
  <button class="btn" id="refresh" title="以唯讀 GET 重新抓取持倉快照並重算">重新整理</button>
</header>
<main>
<div id="hint"></div>
<div id="err"></div>
<section id="ov" class="on"></section>
<section id="bg">
  <nav class="subnav" id="subnav">
    <button data-p="bgsum" class="on">概況與對帳</button><button data-p="hold">持倉與成本</button><button data-p="real">已實現盈虧</button><button data-p="flow">資金流</button><button data-p="dq">資料品質</button>
  </nav>
  <div class="sub on" id="bgsum"></div>
  <div class="sub" id="hold"></div>
  <div class="sub" id="real"></div>
  <div class="sub" id="flow"></div>
  <div class="sub" id="dq"></div>
</section>
<section id="mx"></section>
<section id="kr"></section>
<section id="cc"></section>
<section id="wl"></section>
<section id="ef"></section>
<section id="ib"></section>
</main>
<script>
const TOKEN="__BITGUARD_TOKEN__";
let D=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(x,d=2)=>x==null||isNaN(x)?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const amt=(x,d=2)=>`<span class="amt">${num(x,d)}</span>`;
const sgn=x=>x==null?"":x>0?"up":x<0?"down":"";
const pct=(x,d=1)=>x==null||!isFinite(x)?"—":`<span class="${sgn(x)}">${x>0?"+":""}${num(x,d)}%</span>`;
const share=(x,base)=>base?pct(x/base*100):"—";
const qty=x=>x==null?"—":`<span class="amt">${Number(x).toPrecision(6).replace(/\.?0+$/,"")}</span>`;
const ORIGIN={spot_buy:"現貨買入",spot_grid_bot:"網格機器人",dual_strike:"雙幣（行權價）",dual_market:"雙幣（市價）",dual_settle:"雙幣結算",reward:"獎勵／利息",earn_accrued:"理財累積",settlement_0704:"07-04 結算代幣",deposit:"鏈上充值",fiat_deposit:"法幣入金",eur_purchase:"歐元買入",convert:"閃兌",transfer_in:"轉入","cash+":"Cash+",bot_funding:"機器人投入"};
const oname=o=>ORIGIN[o]||(o.startsWith("other_in:")?"其他轉入（"+o.slice(9)+"）":o);
const CONF={high:"高",medium:"中",low:"低"};

function tab(id){if(!document.getElementById(id))id="ov";
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.s===id));
  document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("on",s.id===id));localStorage.setItem("bg_tab",id);scrollTo(0,0)}
function subtab(id){document.querySelectorAll("#subnav button").forEach(x=>x.classList.toggle("on",x.dataset.p===id));
  document.querySelectorAll("#bg>.sub").forEach(s=>s.classList.toggle("on",s.id===id));localStorage.setItem("bg_sub",id)}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(b)tab(b.dataset.s)};
document.getElementById("subnav").onclick=e=>{const b=e.target.closest("button");if(b)subtab(b.dataset.p)};
tab(localStorage.getItem("bg_tab")||"ov");subtab(localStorage.getItem("bg_sub")||"bgsum");
const hide=$("#hide");hide.checked=localStorage.getItem("bg_hide")!=="0";document.body.classList.toggle("hide",hide.checked);
hide.onchange=()=>{document.body.classList.toggle("hide",hide.checked);localStorage.setItem("bg_hide",hide.checked?"1":"0")};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showStatus(R){const el=$("#rstatus");if(!R||(!R.running&&!R.stage)){el.innerHTML="";return}
  el.innerHTML=`<span>${esc(R.stage||"")}</span>${R.running?`<div class="bar"><i style="width:${R.pct||0}%;background:var(--acc)"></i></div>`:""}`}
$("#refresh").onclick=async()=>{const b=$("#refresh");b.disabled=true;b.textContent="更新中…";
  try{const r=await fetch("/api/refresh",{method:"POST",headers:{"X-Bitguard-Token":TOKEN}});const j=await r.json();
    if(!r.ok){showHint(j.error||("錯誤 "+r.status));return}
    for(;;){await sleep(1500);const s=await (await fetch("/api/status")).json();showStatus(s.refresh);
      if(!s.refresh.running){if(s.refresh.error){showHint(s.refresh.error)}else{await load();showStatus({stage:"已更新 "+(s.refresh.last||"").slice(11,16)+"　"+(s.refresh.log||[]).join("；")})}break}}
  }catch(e){showHint("更新失敗："+e.message)}finally{b.disabled=false;b.textContent="重新整理"}};
function showHint(t){const h=$("#hint");if(!t){h.style.display="none";return}
  h.innerHTML=esc(t).replace(/((?:\.venv\/bin\/python|python3) -m assetsboard [a-z-]+[^\n（。，]*)/g,'<code>$1</code>');h.style.display="block"}
async function saveAppTotal(){const v=$("#apptotal").value.trim();
  const r=await fetch("/api/app-total",{method:"POST",headers:{"X-Bitguard-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify({value:v===""?null:v})});
  const j=await r.json();if(!r.ok){alert(j.error||r.status);return}D.app_total=j;renderBitget();renderOverview()}
// MEXC Earn: no API -> manual fixed USDT value (手動填入). Totals are recomputed here so a save shows immediately.
function earnInfo(){const E=D.mexc_earn||(D.mexc||{}).earn_manual;if(!E||E.value==null)return null;
  const age=E.set_at?(Date.now()-Date.parse(E.set_at))/864e5:null;return {...E,age_days:age,stale:age==null||age>30}}
function applyEarn(){const M=D.mexc;if(!M||!M.present)return;const X=D.exchanges||{},C=D.combined||{};
  const api=M.total_api!=null?M.total_api:(M.total||0)-(M.earn||0),E=earnInfo(),ev=E?E.value:0,old=M.total;
  M.total_api=api;M.earn=E?ev:null;M.earn_manual=E;M.total=api+ev;
  if(M.pnl!=null){M.pnl=M.total-M.net_inflow;M.pnl_pct=M.net_inflow>0?M.pnl/M.net_inflow*100:null}
  if(M.pre_window_from_bitget&&M.pnl!=null)M.pnl_if_no_other_flows=M.pnl-M.pre_window_from_bitget.net_to_mexc;
  const BL=M.baseline;if(BL){BL.pnl=M.pnl;BL.pnl_pct=M.pnl_pct;BL.other=M.pnl-(BL.spot_realized+BL.futures_realized+BL.funding)}
  if(X.mexc){Object.assign(X.mexc,{total:M.total,total_api:api,earn:M.earn,earn_manual:E,pnl:M.pnl,pnl_pct:M.pnl_pct,pnl_if_no_other_flows:M.pnl_if_no_other_flows})}
  if(C.total!=null&&old!=null){C.total+=M.total-old;C.pnl=C.total-C.net_inflow;C.pnl_pct=C.net_inflow?C.pnl/C.net_inflow*100:null;
    C.manual_parts=E?[{exchange:"mexc",what:"MEXC 理財（手動填入）",...E}]:[];
    Object.values(X).forEach(v=>{if(v.present)v.share=C.total?v.total/C.total*100:null});
    const G=C.groups;if(G&&G.crypto){G.crypto.total+=M.total-old;if(G.crypto.net_inflow!=null){G.crypto.pnl=G.crypto.total-G.crypto.net_inflow;G.crypto.pnl_pct=G.crypto.net_inflow?G.crypto.pnl/G.crypto.net_inflow*100:null}
      Object.values(G).forEach(g=>{g.share=C.total?g.total/C.total*100:null})}}}
function earnTag(E){if(!E)return "";const d=(E.set_at||"").slice(0,10);
  return `<span class="${E.stale?"stale":"tag"}" title="MEXC 理財沒有 API，這是手動填入的固定 USDT 值，不會重新估價">手動填入 ${esc(d)}${E.stale?" ⚠ 超過 30 天":""}</span>`}
async function saveMexcEarn(){const v=$("#mxearn").value.trim().replace(/,/g,"");let r;
  try{r=await fetch("/api/mexc-earn",{method:"POST",headers:{"X-Bitguard-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify({value:v===""?null:v})})}catch(e){alert(e.message);return}
  if(r.status===404){alert("目前執行中的 AssetsBoard 版本還沒有這個功能：請結束並重新開啟 AssetsBoard.app，或在終端機執行\n.venv/bin/python -m assetsboard set-mexc-earn "+(v||"clear")+"\n再執行 analyze。");return}
  const j=await r.json();if(!r.ok){alert(j.error||r.status);return}D.mexc_earn=j;applyEarn();renderOverview();renderMexc()}
function card(k,v,s){return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`}

function hbars(rows,key,label,fmt){ // rows sorted; symmetrical bars
  const mx=Math.max(1e-9,...rows.map(r=>Math.abs(r[key])));
  return `<table>${rows.map(r=>`<tr><td class="l" style="width:34%">${esc(r[label])}</td><td style="width:44%"><div class="bar"><i style="width:${Math.abs(r[key])/mx*100}%;background:${r[key]>=0?"var(--up)":"var(--down)"}"></i></div></td><td>${fmt(r)}</td></tr>`).join("")}</table>`;
}

function xcheck(o,A,diff){const X=o.crosscheck||[];if(!X.length)return "";
  const AN={spot:"現貨",earn:"理財",futures:"合約",bots:"機器人",funding:"資金",margin:"槓桿"};
  const rows=X.filter(x=>Math.abs(x.bitget||0)>0.005||Math.abs(x.ours||0)>0.005).map(x=>`<tr><td class="l">${AN[x.account]||esc(x.account)}</td><td>${x.bitget==null?"—":amt(x.bitget)}</td><td>${amt(x.ours||0)}</td><td>${amt(x.diff)}</td><td class="l mut">API 即時</td></tr>`).join("");
  const IN={poolx:"PoolX 鎖倉",uta:"uta"},IM={poolx:"帳本推算數量 × 即時價",uta:"劃轉淨額（以成本；經典帳戶讀不到 uta 餘額）"};
  const inv=(o.invisible||[]).map(x=>`<tr><td class="l">${IN[x.item]||esc(x.item)}</td><td>—</td><td>${amt(x.value)}</td><td></td><td class="l mut">${IM[x.item]||esc(x.method)}</td></tr>`).join("");
  let foot=`<tr><td class="l"><b>Bitget API 帳戶總額</b></td><td>${amt(o.total_bitget_api||0)}</td><td></td><td></td><td class="l mut">all-account-balance 加總（不含 PoolX、uta）</td></tr>
   <tr><td class="l"><b>API＋PoolX＋uta</b></td><td>${amt(o.total_bitget_api_plus_invisible||0)}</td><td>${amt(o.total_auto)}</td><td>${amt(o.total_auto-(o.total_bitget_api_plus_invisible||0))}</td><td class="l mut">Bitget 估值 vs 本工具即時價</td></tr>`;
  let note="";if(A.value!=null){const uta=(o.invisible||[]).find(x=>x.item==="uta");
    if(uta){const imp=uta.value+diff;note=`<div class="small" style="margin-top:6px">若差額全部來自 uta：uta 隱含現值 ≈ ${amt(imp)}（成本 ${amt(uta.value)}，${pct(uta.value?diff/uta.value*100:null)}）。uta 餘額在經典帳戶模式下 API 無法讀取（40084），請在 App 確認。</div>`}}
  return `<h2 style="margin-top:14px">逐帳戶對帳（快照 ${esc((o.snapshot_time||"").slice(0,16).replace("T"," "))}）</h2><table><tr><th class="l">項目</th><th>Bitget 估值</th><th>本工具</th><th>差</th><th class="l">來源</th></tr>${rows}${inv}${foot}</table>${note}`}
function merged(){const E=D.exchanges,C=D.combined;if(!E)return "";
  const N={bitget:"Bitget",mexc:"MEXC",kraken:"Kraken",cryptocom:"Crypto.com",wallets:"鏈上錢包",etherfi_cash:"ether.fi Cash",ibkr:"IBKR"};
  const rows=Object.entries(E).map(([k,v])=>v.present?`<tr><td class="l">${N[k]||esc(k)} <span class="tag">${v.group==="securities"?"證券":v.group==="spending"?"開銷":"加密"}</span></td><td>${amt(v.total)}${k==="ibkr"&&v.nav_base!=null?`<div class="small">${amt(v.nav_base)} ${esc(v.base_currency)}</div>`:""}${k==="mexc"&&v.earn_manual?`<div class="small">含理財 ${amt(v.earn_manual.value)} ${earnTag(v.earn_manual)}</div>`:""}${k==="wallets"&&v.n_wallets?`<div class="small">${v.n_wallets} 個錢包</div>`:""}</td><td>${pct(v.share).replace(/[+]/,"")}</td><td>${v.net_inflow==null?"—":amt(v.net_inflow)}</td><td>${v.pnl==null?"—":amt(v.pnl)}</td><td>${pct(v.pnl_pct)}${k==="mexc"&&v.baseline?` <span class="tag">${esc(v.baseline.label)}</span>`:k==="mexc"&&!v.history_complete?' <span class="stale" title="MEXC API 只能查 90 天充提；更早的入金看不到">⚠ 歷史可能不完整</span>':k==="kraken"&&!v.history_complete?' <span class="stale" title="Kraken 帳本尚未完整讀取">⚠ 帳本未完整</span>':k==="ibkr"&&v.baseline?` <span class="tag">${esc(v.baseline.label)}</span>`:k==="cryptocom"&&(v.full_history||v.baseline)?` <span class="tag" title="${v.full_history?"盈虧 % 以開戶以來總入金計算":""}">${esc((v.full_history||v.baseline).label)}</span>`+(v.warning?' <span class="stale" title="'+esc(v.warning)+'">⚠ 金鑰</span>':""):k==="wallets"&&v.baseline?` <span class="tag">${esc(v.baseline.label)}</span>`:""}</td><td class="mut">${esc((v.snapshot_time||"").slice(0,16).replace("T"," "))}</td></tr>`
    :`<tr><td class="l">${N[k]||esc(k)}</td><td colspan="6" class="l mut">${esc(v.reason||"未設定")}</td></tr>`).join("");
  const bar=Object.entries(E).filter(([k,v])=>v.present&&v.share).map(([k,v],i)=>`<i title="${N[k]}" style="width:${v.share}%;background:${({bitget:"var(--acc)",mexc:"#26c6da",kraken:"#b26bff",cryptocom:"#1199fa",wallets:"#66bb6a",ibkr:"#e0a526"})[k]||"#888"};display:inline-block;height:100%"></i>`).join("");
  return `<div class="panel"><h2>跨交易所總覽</h2>

let hsort={k:"value",d:-1};
function renderHoldings(){
  const cols=[["coin","幣種"],["qty","數量"],["avg_cost","平均成本"],["total_cost","總成本"],["price","現價"],["value","市值"],["unrealized_pct","未實現 %"],["unrealized","未實現"],["confidence","可信度"],["origins","來源（數量 @ 平均成本）"]];
  const rows=[...D.holdings].sort((a,b)=>{const x=a[hsort.k],y=b[hsort.k];if(typeof x==="string"||typeof y==="string")return String(x).localeCompare(String(y))*hsort.d;return((x??-1e18)-(y??-1e18))*hsort.d});
  const tv=D.holdings.reduce((s,x)=>s+(x.value||0),0);
  let h=`<div class="panel"><h2>持倉與溯源成本 <span class="mut small">（平均成本法；點欄位排序；獎勵成本 0，雙幣以行權價，網格返還幣以推算成本）</span></h2><div style="overflow:auto;max-height:75vh"><table><thead><tr>${cols.map(([k,n])=>`<th class="${k==="origins"?"l":""}" data-k="${k}">${n}${hsort.k===k?(hsort.d>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>`;
  for(const x of rows){
    h+=`<tr><td>${esc(x.coin)}${x.in_poolx?' <span class="tag">PoolX</span>':""}</td><td>${qty(x.qty)}</td><td>${x.avg_cost==null?"—":num(x.avg_cost,x.avg_cost<1?6:x.avg_cost<100?4:2)}</td><td>${amt(x.total_cost)}</td>
    <td>${x.price==null?"—":num(x.price,x.price<1?6:x.price<100?4:2)}</td><td>${amt(x.value)} <span class="mut small">${num((x.value||0)/tv*100,1)}%</span></td><td>${pct(x.unrealized_pct)}</td><td>${amt(x.unrealized)}</td>
    <td class="conf-${x.confidence}">${CONF[x.confidence]||x.confidence}</td>
    <td class="l">${(x.origins||[]).map(o=>`<span class="tag o-${esc(o.origin)}">${esc(oname(o.origin))} ${o.qty==null?"":qty(o.qty)+(o.avg_cost!=null?" @ "+num(o.avg_cost,o.avg_cost<1?6:o.avg_cost<100?4:2):"")}</span>`).join("")}</td></tr>`}
  h+=`</tbody></table></div></div>`;
  h+=`<div class="grid2"><div class="panel"><h2>雙幣轉換（以行權價入帳）</h2><table><tr><th>時間</th><th>幣種</th><th>數量</th><th>行權價</th><th>當日市價</th><th>差異</th></tr>${D.dual_conversions.map(d=>`<tr><td>${esc(d.time.slice(0,16))}</td><td>${esc(d.coin)}</td><td>${qty(d.qty)}</td><td>${num(d.strike,4)}</td><td>${num(d.market,4)}</td><td>${pct((d.market/d.strike-1)*100)}</td></tr>`).join("")}</table></div>
   <div class="panel"><h2>現貨網格機器人（返還幣種者）</h2><table><tr><th>關閉</th><th>投入時間</th><th>投入</th><th>返還 USDT</th><th class="l">返還幣（推算成本／期間價格）</th></tr>${D.spot_bot_episodes.filter(e=>Object.keys(e.coins).length).map(e=>`<tr><td>${esc(e.close.slice(0,10))}</td><td>${esc((e.fund_time||"—").slice(0,10))}</td><td>${amt(e.fund)}</td><td>${amt(e.usdt_back)}</td><td class="l">${Object.entries(e.coins).map(([c,q])=>`${esc(c)} ${qty(q)}${e.unit_cost[c]!=null?" @ "+num(e.unit_cost[c],4)+" <span class='mut'>("+num(e.range[c][0],4)+"–"+num(e.range[c][1],4)+")</span>":""}`).join("<br>")}${e.flags.length?`<div class="warn small">${e.flags.map(esc).join("<br>")}</div>`:""}</td></tr>`).join("")}</table></div></div>`;
  $("#hold").innerHTML=h;
  $("#hold thead").onclick=e=>{const th=e.target.closest("th");if(!th||th.dataset.k==="origins")return;const k=th.dataset.k;hsort={k,d:hsort.k===k?-hsort.d:(k==="coin"?1:-1)};renderHoldings()};
}

function renderRealized(){
  const base=D.overview.net_inflow, rc=D.realized_by_coin;
  const losers=rc.filter(r=>r.realized<0).slice(0,12), gainers=rc.filter(r=>r.realized>0).slice(-12).reverse();
  let h=`<div class="panel"><h2>依類別（只計已實現；未實現不計入虧損）</h2><table><tr><th class="l">類別</th><th>佔淨入金</th><th>金額</th><th class="l">明細</th></tr>${D.categories.map(c=>`<tr><td class="l">${esc(c.name)}</td><td>${share(c.realized,base)}</td><td>${amt(c.realized)}</td><td class="l small">${Object.entries(c.detail).map(([k,v])=>`<span class="tag">${esc(k)} ${amt(v)}</span>`).join("")}</td></tr>`).join("")}</table>
   <div class="small mut">「無法歸類」是 API 看不到去向的項目（uta、未標記帳單、07-04 結算代幣、對不上的機器人資金），不計入已實現盈虧。</div></div>
   <div class="grid2"><div class="panel"><h2>獲利最多（現貨，已實現）</h2>${hbars(gainers,"realized","coin",r=>share(r.realized,base)+" "+amt(r.realized))}</div>
   <div class="panel"><h2>虧損最多（現貨，已實現）</h2>${hbars(losers,"realized","coin",r=>share(r.realized,base)+" "+amt(r.realized))}</div></div>
   <div class="panel"><h2>全部幣種已實現</h2><div style="overflow:auto;max-height:50vh"><table><tr><th>幣種</th><th>已實現</th><th>佔淨入金</th></tr>${[...rc].reverse().map(r=>`<tr><td>${esc(r.coin)}</td><td>${amt(r.realized)}</td><td>${share(r.realized,base)}</td></tr>`).join("")}</table></div></div>`;
  $("#real").innerHTML=h;
}

function renderFlows(){
  const M=D.flows_by_month;const S=[["deposit","入金","#2fbf71",1],["withdrawal","出金","#ef5350",1],["transfer_in","轉入","#26c6da",1],["transfer_out","轉出","#e0a526",1],["bot_funding","現貨機器人投入","#b26bff",1],["bot_return","現貨機器人返還","#8e7cc3",1],["futures_bot_funding","合約機器人投入","#4f8cff",1],["futures_bot_return","合約機器人返還","#7aa7ff",1]];
  const W=Math.max(640,M.length*110),H=280,pad=40,bw=(W-pad*2)/M.length;
  const mx=Math.max(1,...M.flatMap(m=>S.map(s=>Math.abs(m[s[0]]||0))));
  const y=v=>H/2-(v/mx)*(H/2-24);let svg=`<line x1="${pad}" x2="${W-pad}" y1="${H/2}" y2="${H/2}" stroke="#2a3140"/>`;
  M.forEach((m,i)=>{const x0=pad+i*bw+6,w=(bw-12)/S.length;S.forEach((s,j)=>{const v=m[s[0]]||0;if(!v)return;const yy=y(v);
    svg+=`<rect x="${x0+j*w}" y="${Math.min(yy,H/2)}" width="${Math.max(w-2,1)}" height="${Math.abs(yy-H/2)}" fill="${s[2]}"><title>${m.month} ${s[1]}</title></rect>`});
    svg+=`<text x="${x0+(bw-12)/2}" y="${H-4}" text-anchor="middle">${m.month}</text>`});
  let h=`<div class="panel"><h2>每月資金流（正＝流入現貨，負＝流出；以當時價格折 USDT）</h2><div class="legend">${S.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join("")}</div><div style="overflow:auto"><svg width="${W}" height="${H}">${svg}</svg></div><div class="small mut">柱高為相對比例；金額見下表（可隱藏）。</div></div>`;
  h+=`<div class="panel"><h2>每月明細</h2><div style="overflow:auto"><table><tr><th>月份</th>${S.map(s=>`<th>${s[1]}</th>`).join("")}</tr>${M.map(m=>`<tr><td>${m.month}</td>${S.map(s=>`<td>${m[s[0]]?amt(m[s[0]]):'<span class="mut">—</span>'}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
  const K={onchain_deposit:"鏈上充值",fiat_bank_deposit:"法幣入金",internal_uid_deposit:"站內充值",fiat_buy_settlement:"法幣買幣結算",onchain_withdrawal:"鏈上提幣",fiat_withdrawal:"法幣出金",internal_uid_withdrawal:"站內提幣"};
  h+=`<div class="panel"><h2>外部出入金紀錄</h2><div style="overflow:auto;max-height:50vh"><table><tr><th>時間</th><th class="l">類型</th><th>幣種</th><th>數量</th><th>USDT</th><th class="l">鏈</th></tr>${[...D.external_flows].reverse().map(e=>`<tr><td>${esc((e.time||"").slice(0,16))}</td><td class="l">${esc(K[e.kind]||e.kind)}</td><td>${esc(e.coin)}</td><td>${qty(e.qty)}</td><td>${amt(e.usd)}</td><td class="l">${esc(e.chain||"")}</td></tr>`).join("")}</table></div></div>`;
  $("#flow").innerHTML=h;
}

function renderDQ(){
  const q=D.data_quality;
  let h=`<div class="panel"><h2>API 看不到／限制</h2>${q.notes.map(n=>`<div class="note"><b>${esc(n.topic)}</b> ${esc(n.text)} <span class="tag">${n.status==="confirmed"?"已確認":"推論"}</span></div>`).join("")}</div>`;
  h+=`<div class="grid2"><div class="panel"><h2>封存來源</h2><table><tr><th>來源</th><th>筆數</th><th>最早</th><th>最新</th></tr>${Object.entries(q.archive_sources).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.rows}</td><td>${v.earliest||"—"}</td><td>${v.latest||"—"}</td></tr>`).join("")}</table>
   <div class="small mut">上次封存：${esc(q.last_archive_run||"—")}。90 天限制的來源請每月至少執行一次 <code>.venv/bin/python -m assetsboard archive</code>。</div></div>
   <div class="panel"><h2>分析假設與警告</h2>
   <div class="note"><b>方法</b> ${esc(D.method)}</div>
   <div class="note"><b>手動輸入</b> ${Object.entries(D.overrides).map(([k,v])=>`<span class="tag">${esc(k)}: ${v==null?"未設定":amt(v)}</span>`).join("")}<div class="small mut">編輯 snapshots/analysis_overrides.json 後執行 analyze。</div></div>
   <div class="note"><b>封存錯誤</b> ${Object.keys(q.archive_errors||{}).length?esc(JSON.stringify(q.archive_errors)):"無"}</div>
   <div class="note"><b>缺價格</b> ${(q.price_misses||[]).map(m=>esc(m.coin)).join("、")||"無"}</div>
   <div class="note"><b>帳本不足</b> ${Object.keys(q.inventory_deficits||{}).length?Object.entries(q.inventory_deficits).map(([c,v])=>`${esc(c)} ${qty(v)}`).join("、")+"（賣出／轉出多於帳本流入，可能為 API 看不到的產品）":"無"}</div>
   <div class="note"><b>機器人</b> 未配對的投入 ${D.unmatched_bot_fundings.length} 筆；未配對的返還 ${D.spot_bot_episodes.filter(e=>e.fund==null).length} 筆</div>
   </div></div>`;
  $("#dq").innerHTML=h;
}

async function load(){
  try{const st=await (await fetch("/api/status")).json();const rb=$("#refresh");
    if(!st.credentials){rb.textContent="重新整理（無憑證）";rb.title="沒有 Bitget API 憑證，只顯示本機資料";showHint(st.no_credentials_hint)}
    else{rb.textContent="重新整理";rb.title="唯讀 GET：封存新紀錄＋持倉快照，再重新分析";showHint("")}
    if(st.refresh&&st.refresh.running)showStatus(st.refresh)}catch(e){}
  try{const r=await fetch("/api/analysis");D=await r.json();if(!r.ok)throw new Error(D.error||r.status);
    $("#err").textContent="";
    $("#meta").textContent=`分析 ${D.generated_oslo.slice(0,16).replace("T"," ")}　快照 ${(D.overview.snapshot_time||"").slice(0,16).replace("T"," ")}（Oslo）`;
    applyEarn();renderOverview();renderBitget();renderHoldings();renderRealized();renderFlows();renderMexc();renderKraken();renderCdc();renderWallets();renderEtherfi();renderIbkr();renderDQ();
  }catch(e){$("#err").textContent="無法載入分析："+e.message}
}
load();
</script>
